<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>LinkedIn Post Generator</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --border: #2a2a2a;
      --accent: #4f7cff;
      --accent-dim: #1e2d5e;
      --text: #f0f0f0;
      --text-dim: #888;
      --green: #22c55e;
      --red: #ef4444;
      --tg: #2aabee;
      --tg-dim: #0d2a3d;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      padding: 16px;
      padding-bottom: 40px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .header-icon {
      width: 36px;
      height: 36px;
      background: var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .header p {
      font-size: 12px;
      color: var(--text-dim);
    }

    .mode-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 20px;
      background: var(--surface);
      padding: 4px;
      border-radius: 10px;
    }

    .tab {
      flex: 1;
      padding: 8px 4px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      transition: all 0.2s;
      background: transparent;
      color: var(--text-dim);
    }

    .tab.active {
      background: var(--accent);
      color: white;
    }

    .tab.active.tg-tab {
      background: var(--tg);
    }

    .mode-panel {
      display: none;
    }

    .mode-panel.active {
      display: block;
    }

    .field-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    textarea, input[type="text"] {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 15px;
      padding: 12px 14px;
      resize: none;
      outline: none;
      font-family: inherit;
      transition: border-color 0.2s;
      margin-bottom: 16px;
    }

    textarea:focus, input[type="text"]:focus {
      border-color: var(--accent);
    }

    #mode-telegram textarea:focus {
      border-color: var(--tg);
    }

    textarea {
      min-height: 100px;
    }

    .tone-selector {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .tone-btn {
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-dim);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tone-btn.selected {
      border-color: var(--accent);
      background: var(--accent-dim);
      color: var(--accent);
    }

    .generate-btn {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-bottom: 20px;
    }

    .generate-btn.tg-btn {
      background: var(--tg);
    }

    .generate-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .generate-btn:not(:disabled):hover {
      opacity: 0.9;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 30px;
      color: var(--text-dim);
    }

    .loading.show {
      display: block;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }

    .spinner.tg {
      border-top-color: var(--tg);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .result-box {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-top: 4px;
    }

    .result-box.show {
      display: block;
    }

    .result-box.tg-result {
      border-color: var(--tg-dim);
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .result-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .char-count {
      font-size: 11px;
      color: var(--text-dim);
    }

    .result-text {
      font-size: 15px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 16px;
    }

    .result-actions {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .action-btn.primary {
      background: var(--accent);
      border-color: var(--accent);
    }

    .action-btn.primary.tg {
      background: var(--tg);
      border-color: var(--tg);
    }

    .action-btn:hover {
      opacity: 0.8;
    }

    .copy-toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--green);
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      transition: all 0.3s;
      pointer-events: none;
    }

    .copy-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .error-msg {
      background: #1a0a0a;
      border: 1px solid var(--red);
      border-radius: 8px;
      padding: 12px;
      color: var(--red);
      font-size: 13px;
      margin-top: 8px;
      display: none;
    }

    .error-msg.show {
      display: block;
    }

    .comments-result-box {
      display: none;
    }

    .comments-result-box.show {
      display: block;
    }

    .comment-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .comment-card-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .comment-card-text {
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 12px;
      white-space: pre-wrap;
    }

    .comment-copy-btn {
      width: 100%;
    }

    .tg-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      background: var(--tg-dim);
      color: var(--tg);
      border-radius: 4px;
      padding: 2px 6px;
      letter-spacing: 0.5px;
      margin-left: 6px;
      vertical-align: middle;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-icon">✍️</div>
    <div>
      <h1>PostBot</h1>
      <p>LinkedIn · Telegram</p>
    </div>
  </div>

  <div class="mode-tabs">
    <button class="tab active" onclick="switchMode('topic')">Тема</button>
    <button class="tab" onclick="switchMode('thought')">Мысль</button>
    <button class="tab" onclick="switchMode('comment')">Коммент</button>
    <button class="tab tg-tab" onclick="switchMode('telegram')">TG</button>
    <button class="tab" onclick="switchMode('format')">Оформить</button>
    <button class="tab tg-tab" onclick="switchMode('newsquote')">Рубрика</button>
  </div>

  <!-- Режим 1: По теме -->
  <div id="mode-topic" class="mode-panel active">
    <div class="field-label">Тема поста</div>
    <input type="text" id="topic-input" placeholder="Например: second bet conversion, live betting, bonus cost..." />

    <div class="field-label">Тон</div>
    <div class="tone-selector" id="topic-tone">
      <button class="tone-btn selected" data-tone="expert">Экспертный</button>
      <button class="tone-btn" data-tone="story">История</button>
      <button class="tone-btn" data-tone="contrarian">Провокация</button>
    </div>

    <button class="generate-btn" onclick="generate('topic')">Написать пост</button>
  </div>

  <!-- Режим 2: Из мысли -->
  <div id="mode-thought" class="mode-panel">
    <div class="field-label">Твоя сырая мысль</div>
    <textarea id="thought-input" placeholder="Накидай как есть — факт, наблюдение, инсайт, случай из практики..."></textarea>

    <div class="field-label">Тон</div>
    <div class="tone-selector" id="thought-tone">
      <button class="tone-btn selected" data-tone="expert">Экспертный</button>
      <button class="tone-btn" data-tone="story">История</button>
      <button class="tone-btn" data-tone="contrarian">Провокация</button>
    </div>

    <button class="generate-btn" onclick="generate('thought')">Оформить в пост</button>
  </div>

  <!-- Режим 3: Комментарий -->
  <div id="mode-comment" class="mode-panel">
    <div class="field-label">Пост на который комментируешь</div>
    <textarea id="comment-input" placeholder="Вставь текст чужого поста целиком..."></textarea>

    <button class="generate-btn" onclick="generate('comment')">Сгенерировать комментарии</button>
  </div>

  <!-- Режим: Определить рубрику и оформить -->
  <div id="mode-newsquote" class="mode-panel">
    <div class="field-label">Готовый пост <span class="tg-badge">TELEGRAM</span></div>
    <textarea id="newsquote-input" placeholder="Вставь свой уже написанный пост целиком, ничего переписывать не будет..." style="min-height:160px;"></textarea>
    <button class="generate-btn tg-btn" onclick="generateNewsQuote()">Определить рубрику и оформить</button>
  </div>


  <!-- Режим 5: Telegram -->
  <div id="mode-telegram" class="mode-panel">
    <div class="field-label">Мысль или тема <span class="tg-badge">TELEGRAM</span></div>
    <textarea id="telegram-input" placeholder="Накидай как есть — что раздражает, удивляет, наблюдение из практики..."></textarea>
    <button class="generate-btn tg-btn" onclick="generate('telegram')">Написать для Telegram</button>
  </div>

  <!-- Режим 6: Оформить готовый пост -->
  <div id="mode-format" class="mode-panel">
    <div class="field-label">Готовый пост</div>
    <textarea id="format-input" placeholder="Вставь текст уже написанного поста целиком..." style="min-height:160px;"></textarea>

    <div class="field-label">Платформа</div>
    <div class="tone-selector" id="format-platform">
      <button class="tone-btn selected" data-platform="telegram">Telegram</button>
      <button class="tone-btn" data-platform="linkedin">LinkedIn</button>
    </div>

    <button class="generate-btn" id="format-btn" onclick="formatPost()">Оформить</button>
  </div>

  <div class="loading" id="loading">
    <div class="spinner" id="loading-spinner"></div>
    <div id="loading-text">Пишу пост...</div>
  </div>

  <div class="error-msg" id="error-msg"></div>

  <div class="result-box" id="result-box">
    <div class="result-header">
      <span class="result-label" id="result-label">Готовый пост</span>
      <span class="char-count" id="char-count"></span>
    </div>
    <div class="result-text" id="result-text"></div>
    <div class="result-actions">
      <button class="action-btn" onclick="regenerate()">🔄 Ещё раз</button>
      <button class="action-btn primary" id="copy-btn" onclick="copyPost()">📋 Копировать</button>
    </div>
    <button class="action-btn" id="save-archive-btn" style="width:100%; margin-top:8px;" onclick="saveToArchive()">💾 Сохранить в архив</button>
  </div>

  <div class="copy-toast" id="copy-toast">Скопировано!</div>

  <div class="comments-result-box" id="comments-result-box">
    <div class="result-label" style="margin-bottom: 12px;">Варианты комментариев</div>
    <div id="comments-list"></div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    let currentMode = 'topic';
    let lastGenerated = '';

    function switchMode(mode) {
      currentMode = mode;
      const tabOrder = ['topic', 'thought', 'comment', 'telegram', 'format', 'newsquote'];
      document.querySelectorAll('.tab').forEach((t, i) => {
        t.classList.toggle('active', tabOrder[i] === mode);
      });
      document.querySelectorAll('.mode-panel').forEach(p => p.classList.remove('active'));
      document.getElementById(`mode-${mode}`).classList.add('active');
      hideResult();
      hideCommentsResult();
    }

    document.querySelectorAll('.tone-selector').forEach(selector => {
      selector.querySelectorAll('.tone-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          selector.querySelectorAll('.tone-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
        });
      });
    });

    function getSelectedTone(mode) {
      const selector = document.getElementById(`${mode}-tone`);
      return selector?.querySelector('.tone-btn.selected')?.dataset.tone || 'expert';
    }

    let lastMode = '';
    let lastInput = '';
    let lastTone = '';

    async function generate(mode) {
      let input;
      if (mode === 'topic') input = document.getElementById('topic-input').value.trim();
      else if (mode === 'thought') input = document.getElementById('thought-input').value.trim();
      else if (mode === 'telegram') input = document.getElementById('telegram-input').value.trim();
      else input = document.getElementById('comment-input').value.trim();

      if (!input) {
        const msgs = { topic: 'Введи тему поста', thought: 'Накидай мысль', telegram: 'Накидай мысль', comment: 'Вставь текст поста' };
        showError(msgs[mode] || 'Введи текст');
        return;
      }

      const tone = mode === 'comment' ? '' : mode === 'telegram' ? 'telegram' : getSelectedTone(mode);
      lastMode = mode;
      lastInput = input;
      lastTone = tone;

      if (mode === 'comment') {
        await callCommentsAPI(input);
      } else {
        await callAPI(mode, input, tone);
      }
    }

    async function regenerate() {
      if (lastInput) {
        if (lastMode === 'comment') {
          await callCommentsAPI(lastInput);
        } else if (lastMode === 'format') {
          await formatPost();
        } else if (lastMode === 'newsquote') {
          await generateNewsQuote();
        } else {
          await callAPI(lastMode, lastInput, lastTone);
        }
      }
    }

    async function callAPI(mode, input, tone) {
      const isTg = tone === 'telegram';
      showLoading(isTg);
      hideResult();
      hideError();

      try {
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: input, tone, mode })
        });

        const data = await response.json();

        if (!response.ok || data.error) {
          throw new Error(data.error || 'Ошибка API');
        }

        const text = data.text;
        if (!text) throw new Error('Пустой ответ');

        lastGenerated = text;
        showResult(text, isTg);

      } catch (err) {
        showError('Ошибка: ' + err.message);
      } finally {
        hideLoading();
      }
    }

    async function callCommentsAPI(postText) {
      showLoading(false);
      hideResult();
      hideCommentsResult();
      hideError();

      try {
        const response = await fetch('/api/comments', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ postText })
        });

        const data = await response.json();

        if (!response.ok || data.error) {
          throw new Error(data.error || 'Ошибка API');
        }

        const comments = data.comments;
        if (!comments || !comments.length) throw new Error('Пустой ответ');

        showCommentsResult(comments);

      } catch (err) {
        showError('Ошибка: ' + err.message);
      } finally {
        hideLoading();
      }
    }

    function showCommentsResult(comments) {
      const box = document.getElementById('comments-result-box');
      const list = document.getElementById('comments-list');
      list.innerHTML = '';

      comments.forEach((c, i) => {
        const card = document.createElement('div');
        card.className = 'comment-card';
        card.innerHTML = `
          <div class="comment-card-label">${c.label || 'Вариант ' + (i + 1)}</div>
          <div class="comment-card-text">${escapeHtml(c.text)}</div>
          <button class="action-btn primary comment-copy-btn" data-text="${escapeAttr(c.text)}">📋 Копировать</button>
        `;
        list.appendChild(card);
      });

      document.querySelectorAll('.comment-copy-btn').forEach(btn => {
        btn.addEventListener('click', () => copyText(btn.dataset.text));
      });

      box.classList.add('show');
      box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function hideCommentsResult() {
      const box = document.getElementById('comments-result-box');
      if (box) box.classList.remove('show');
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function escapeAttr(str) {
      return str.replace(/"/g, '&quot;');
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      const toast = document.getElementById('copy-toast');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function showResult(text, isTg = false, isSubstack = false) {
      const box = document.getElementById('result-box');
      const label = document.getElementById('result-label');
      const copyBtn = document.getElementById('copy-btn');

      document.getElementById('result-text').textContent = text;
      document.getElementById('char-count').textContent = text.length + ' символов';

      box.classList.remove('tg-result');
      copyBtn.classList.remove('tg');
      copyBtn.style.background = '';
      copyBtn.style.borderColor = '';

      if (isTg) {
        box.classList.add('tg-result');
        label.textContent = 'Для Telegram';
        copyBtn.classList.add('tg');
      } else if (isSubstack) {
        label.textContent = 'Статья для Substack';
        copyBtn.style.background = '#ff6719';
        copyBtn.style.borderColor = '#ff6719';
      } else {
        label.textContent = 'Готовый пост';
      }

      box.classList.add('show');
      box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function hideResult() {
      document.getElementById('result-box').classList.remove('show');
    }

    function showLoading(isTg = false, text = null) {
      document.getElementById('loading-spinner').className = isTg ? 'spinner tg' : 'spinner';
      document.getElementById('loading-text').textContent = text || (isTg ? 'Пишу для Telegram...' : 'Пишу пост...');
      document.getElementById('loading').classList.add('show');
      document.querySelectorAll('.generate-btn').forEach(b => b.disabled = true);
    }

    function hideLoading() {
      document.getElementById('loading').classList.remove('show');
      document.querySelectorAll('.generate-btn').forEach(b => b.disabled = false);
    }

    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg;
      el.classList.add('show');
    }

    function hideError() {
      document.getElementById('error-msg').classList.remove('show');
    }

    async function copyPost() {
      if (!lastGenerated) return;
      await copyText(lastGenerated);
    }

    async function saveToArchive() {
      if (!lastGenerated) return;
      const btn = document.getElementById('save-archive-btn');
      const originalText = btn.textContent;
      btn.textContent = 'Сохраняю...';
      btn.disabled = true;

      try {
        const response = await fetch('/api/save-draft', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ postText: lastGenerated, topic: lastInput })
        });

        const data = await response.json();

        if (!response.ok || data.error) {
          throw new Error(data.error || 'Ошибка сохранения');
        }

        btn.textContent = '✅ Сохранено';
        setTimeout(() => {
          btn.textContent = originalText;
          btn.disabled = false;
        }, 2000);

      } catch (err) {
        btn.textContent = '❌ Ошибка';
        setTimeout(() => {
          btn.textContent = originalText;
          btn.disabled = false;
        }, 2000);
      }
    }

    function getSelectedPlatform() {
      const selector = document.getElementById('format-platform');
      return selector?.querySelector('.tone-btn.selected')?.dataset.platform || 'telegram';
    }

    async function formatPost() {
      const input = document.getElementById('format-input').value.trim();
      if (!input) {
        showError('Вставь текст поста');
        return;
      }

      const platform = getSelectedPlatform();
      const isTg = platform === 'telegram';

      lastMode = 'format';
      lastInput = input;
      lastTone = platform;

      showLoading(isTg, 'Оформляю...');
      hideResult();
      hideError();

      try {
        const response = await fetch('/api/format-post', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ postText: input, platform })
        });

        const data = await response.json();

        if (!response.ok || data.error) {
          throw new Error(data.error || 'Ошибка API');
        }

        const text = data.text;
        if (!text) throw new Error('Пустой ответ');

        lastGenerated = text;
        showResult(text, isTg, false);

      } catch (err) {
        showError('Ошибка: ' + err.message);
      } finally {
        hideLoading();
      }
    }

    // ===== RUBRIC FORMAT LOGIC =====

    async function generateNewsQuote() {
      const input = document.getElementById('newsquote-input').value.trim();
      if (!input) {
        showError('Вставь текст поста');
        return;
      }

      lastMode = 'newsquote';
      lastInput = input;
      lastTone = 'telegram';

      showLoading(true, 'Определяю рубрику...');
      hideResult();
      hideError();

      try {
        const response = await fetch('/api/rubric-format', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ postText: input })
        });

        const data = await response.json();

        if (!response.ok || data.error) {
          throw new Error(data.error || 'Ошибка API');
        }

        const text = data.text;
        if (!text) throw new Error('Пустой ответ');

        lastGenerated = text;
        showResult(text, true, false);

      } catch (err) {
        showError('Ошибка: ' + err.message);
      } finally {
        hideLoading();
      }
    }
  </script>
</body>
</html>
